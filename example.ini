[agent]
endpoint = https://wildnetwork.arunrajiah.com/api/v1/events
api_key = wn_replace_me
source = birdnet-pi
path = /home/pi/BirdNET-Pi/scripts/birds.db
station_name = my-garden
latitude =
longitude =
round_coords = 2
min_confidence = 0.7
interval_seconds = 60
state_file = /var/lib/wdx-agent/state.json
